<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/katex.min.css">
<script src="js/marked.min.js"></script>
<script src="js/highlight.min.js"></script>
<script src="js/katex.min.js"></script>
<script src="js/mermaid.min.js"></script>
<style>
/* ── Reset & Base ──────────────────────────────────────────── */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0f14;
  color: #e2e8f0;
  font-family: "Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;
  font-size: 13px;
  padding: 12px;
  overflow-x: hidden;
}

/* ── Scrollbar ─────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0d0f14; }
::-webkit-scrollbar-thumb { background: #2a3045; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #64748b; }

/* ── Node Detail Card ──────────────────────────────────────── */
.node-card {
  background: #111827;
  border: 1px solid #2a3045;
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 12px;
}

.card-header {
  font-size: 13px;
  font-weight: 700;
  color: #e2e8f0;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid #2a3045;
  display: flex;
  align-items: center;
  gap: 8px;
}

.type-badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.type-badge.notebook {
  background: #1e3a5f;
  color: #60a5fa;
}

.type-badge.concept {
  background: #7c2d12;
  color: #fb923c;
}

.card-body {
  line-height: 1.7;
}

/* ── Placeholder ───────────────────────────────────────────── */
.placeholder {
  text-align: center;
  padding: 40px 20px;
  color: #64748b;
}
.placeholder-icon { font-size: 28px; margin-bottom: 10px; }
.placeholder-text { font-size: 12px; }

/* ── Markdown content (chat.html과 동일) ──────────────────── */
.card-body p { margin: 0.4em 0; }
.card-body pre {
  position: relative;
  background: #0a0e17;
  border-left: 3px solid #f97316;
  border-radius: 0 4px 4px 0;
  padding: 8px;
  overflow-x: auto;
  font-size: 11px;
  line-height: 1.5;
  margin: 0.5em 0;
}
.copy-btn {
  position: absolute;
  top: 4px;
  right: 4px;
  background: #2a3045;
  color: #94a3b8;
  border: 1px solid #3a4055;
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px;
  font-family: "Pretendard","Malgun Gothic",sans-serif;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 1;
}
.card-body pre:hover .copy-btn { opacity: 1; }
.copy-btn:hover { background: #3a4055; color: #e2e8f0; }
.copy-btn.copied { color: #4ade80; border-color: #4ade80; }
.card-body pre code {
  background: none;
  color: inherit;
  padding: 0;
  border-radius: 0;
  font-size: 11px;
}
.card-body code {
  font-family: "JetBrains Mono",Consolas,monospace;
}
.card-body :not(pre) > code {
  background: #0d1117;
  color: #f97316;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
}
.card-body table { border-collapse: collapse; margin: 0.5em 0; width: 100%; }
.card-body th, .card-body td {
  border: 1px solid #2a3045;
  padding: 4px 8px;
  font-size: 12px;
  text-align: left;
}
.card-body th { background: #1e2330; color: #94a3b8; font-weight: 600; }
.card-body h1, .card-body h2, .card-body h3, .card-body h4, .card-body h5, .card-body h6 {
  color: #60a5fa;
  margin: 0.6em 0 0.3em;
}
.card-body h1 { font-size: 1.3em; }
.card-body h2 { font-size: 1.15em; }
.card-body h3 { font-size: 1.05em; }
.card-body ul, .card-body ol { padding-left: 1.5em; margin: 0.3em 0; }
.card-body li { margin: 0.15em 0; }
.card-body hr { border: none; border-top: 1px solid #2a3045; margin: 0.6em 0; }
.card-body blockquote {
  border-left: 3px solid #a78bfa;
  padding-left: 10px;
  color: #94a3b8;
  margin: 0.4em 0;
}
.card-body strong { color: #f1f5f9; }
.card-body em { color: #cbd5e1; }
.card-body a {
  color: #60a5fa;
  text-decoration: none;
}
.card-body a:hover { text-decoration: underline; }

/* ── Mermaid diagram ──────────────────────────────────────── */
.mermaid-wrapper {
  background: #111827;
  border: 1px solid #2a3045;
  border-radius: 4px;
  padding: 12px;
  margin: 0.8em 0;
  overflow-x: auto;
  text-align: center;
  position: relative;
}
.mermaid-wrapper svg {
  max-width: 100%;
  height: auto;
}
.mermaid-save-btn {
  position: absolute; top: 6px; right: 6px;
  background: #2a3045; color: #94a3b8; border: 1px solid #3a4055;
  border-radius: 4px; padding: 2px 7px; font-size: 10px;
  font-family: "Pretendard","Malgun Gothic",sans-serif;
  cursor: pointer; opacity: 0; transition: opacity 0.15s;
}
.mermaid-wrapper:hover .mermaid-save-btn { opacity: 1; }
.mermaid-save-btn:hover { background: #3a4055; color: #e2e8f0; }
.mermaid-save-btn.saved { color: #4ade80; border-color: #4ade80; }

</style>
</head>
<body>

<div id="container"></div>

<script>
// KaTeX 수학 확장 (marked.js 플러그인)
function _katexRender(text, displayMode) {
  if (!window.katex) return null;
  try { return katex.renderToString(text, { displayMode: displayMode, throwOnError: false }); }
  catch(e) { return null; }
}

const mathExtension = {
  extensions: [
    // $$...$$ (display block)
    {
      name: 'displayMath',
      level: 'block',
      start(src) { return src.indexOf('$$'); },
      tokenizer(src) {
        const m = src.match(/^\$\$([\s\S]*?)\$\$/);
        if (m) return { type: 'displayMath', raw: m[0], text: m[1].trim() };
      },
      renderer(token) {
        return _katexRender(token.text, true) || '<span>' + token.raw + '</span>';
      }
    },
    // \[...\] (display block)
    {
      name: 'displayMathBracket',
      level: 'block',
      start(src) { return src.indexOf('\\['); },
      tokenizer(src) {
        const m = src.match(/^\\\[([\s\S]*?)\\\]/);
        if (m) return { type: 'displayMathBracket', raw: m[0], text: m[1].trim() };
      },
      renderer(token) {
        return _katexRender(token.text, true) || '<span>' + token.raw + '</span>';
      }
    },
    // $...$ (inline)
    {
      name: 'inlineMath',
      level: 'inline',
      start(src) { return src.indexOf('$'); },
      tokenizer(src) {
        const m = src.match(/^\$((?:[^$\\\n]|\\.)+?)\$/);
        if (m) return { type: 'inlineMath', raw: m[0], text: m[1].trim() };
      },
      renderer(token) {
        return _katexRender(token.text, false) || '<span>' + token.raw + '</span>';
      }
    },
    // \(...\) (inline)
    {
      name: 'inlineMathParen',
      level: 'inline',
      start(src) { return src.indexOf('\\('); },
      tokenizer(src) {
        const m = src.match(/^\\\(((?:[^\\]|\\.)*?)\\\)/);
        if (m) return { type: 'inlineMathParen', raw: m[0], text: m[1].trim() };
      },
      renderer(token) {
        return _katexRender(token.text, false) || '<span>' + token.raw + '</span>';
      }
    }
  ]
};
marked.use(mathExtension);

// Mermaid code fence 인터셉트
const mermaidExtension = {
  renderer: {
    code(token) {
      if (token.lang === 'mermaid') {
        const escaped = (token.text || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        return '<div class="mermaid-wrapper"><div class="mermaid">' + escaped + '</div></div>';
      }
      return false;
    }
  }
};
marked.use(mermaidExtension);

// Configure marked
marked.setOptions({
  breaks: true,
  gfm: true,
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      try { return hljs.highlight(code, { language: lang }).value; }
      catch(e) {}
    }
    try { return hljs.highlightAuto(code).value; }
    catch(e) {}
    return code;
  }
});

// Configure mermaid
if (window.mermaid) {
  mermaid.initialize({
    startOnLoad: false,
    theme: 'dark',
    securityLevel: 'loose',
    fontFamily: '"Pretendard","Malgun Gothic",sans-serif',
    fontSize: 13,
    suppressErrorRendering: true
  });

  // 폭탄 아이콘이 들어간 error SVG를 DOM 어디에서든 자동 제거
  function _isMermaidErrorSvg(node) {
    if (!node || node.nodeType !== 1) return false;
    if (node.tagName !== 'svg' && node.tagName !== 'SVG') return false;
    var html = node.outerHTML || '';
    return html.indexOf('Syntax error') !== -1 ||
           html.indexOf('aria-roledescription="error"') !== -1;
  }
  var _mermaidObserver = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      m.addedNodes.forEach(function(node) {
        if (_isMermaidErrorSvg(node)) {
          var wrapper = node.closest && node.closest('.mermaid-wrapper');
          if (wrapper) wrapper.style.display = 'none';
          else node.remove();
        }
      });
    });
  });
  _mermaidObserver.observe(document.body, { childList: true, subtree: true });
}

function fixMdSpaces(md) {
  return md.replace(/\*\*[ \t]+((?:[^\n*]|\*(?!\*))+?)[ \t]+\*\*/g, '**$1**');
}

function copyViaConsole(text) {
  console.log("__COPY__:" + text);
}

function addCopyButtons(root) {
  root.querySelectorAll('pre > code').forEach(function(codeEl) {
    var pre = codeEl.parentElement;
    if (pre.querySelector('.copy-btn')) return;
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '복사';
    btn.addEventListener('click', function() {
      copyViaConsole(codeEl.textContent);
      btn.textContent = '✓ 복사됨';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.textContent = '복사';
        btn.classList.remove('copied');
      }, 1500);
    });
    pre.appendChild(btn);
  });
}

function _attachMermaidSaveBtn(el) {
  var wrapper = el.closest('.mermaid-wrapper');
  if (!wrapper || wrapper.querySelector('.mermaid-save-btn')) return;
  var btn = document.createElement('button');
  btn.className = 'mermaid-save-btn';
  btn.textContent = 'SVG';
  btn.title = 'SVG로 저장';
  btn.addEventListener('click', function() {
    var svgEl = el.querySelector('svg');
    if (!svgEl) return;
    var clone = svgEl.cloneNode(true);
    if (!clone.getAttribute('xmlns')) clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    if (!clone.getAttribute('xmlns:xlink')) clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    var svgText = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
    var b64 = btoa(unescape(encodeURIComponent(svgText)));
    var name = 'mermaid-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    console.log('__SAVE_SVG__:' + name + '|' + b64);
    btn.textContent = '✓ 저장됨';
    btn.classList.add('saved');
    setTimeout(function() {
      btn.textContent = 'SVG';
      btn.classList.remove('saved');
    }, 1500);
  });
  wrapper.appendChild(btn);
}

function renderMermaid(root) {
  if (!window.mermaid) return;
  var nodes = root.querySelectorAll('.mermaid:not([data-processed])');
  if (!nodes.length) return;
  nodes.forEach(function(el) {
    var code = el.textContent;
    var id = 'mermaid-' + Math.random().toString(36).slice(2);
    el.setAttribute('data-processed', 'true');

    function hideWrapper() {
      var wrapper = el.closest('.mermaid-wrapper');
      if (wrapper) wrapper.style.display = 'none';
    }

    var parsePromise;
    try {
      parsePromise = mermaid.parse(code, { suppressErrors: true });
    } catch (e) {
      hideWrapper();
      return;
    }
    Promise.resolve(parsePromise).then(function(parseResult) {
      if (parseResult === false || parseResult === null || parseResult === undefined) {
        hideWrapper();
        return null;
      }
      return mermaid.render(id, code);
    }).then(function(result) {
      if (!result || !result.svg) return;
      if (result.svg.indexOf('Syntax error') !== -1 ||
          result.svg.indexOf('aria-roledescription="error"') !== -1) {
        hideWrapper();
        return;
      }
      el.innerHTML = result.svg;
      _attachMermaidSaveBtn(el);
    }).catch(function(err) {
      hideWrapper();
    });
  });
}

function showNodeDetail(label, nodeType, content) {
  const typeBadge = nodeType === 'notebook'
    ? '<span class="type-badge notebook">📓 Notebook</span>'
    : '<span class="type-badge concept">🔷 Concept</span>';

  const cleanContent = fixMdSpaces(content);
  const htmlContent = marked.parse(cleanContent);

  const html = `
    <div class="node-card">
      <div class="card-header">
        ${typeBadge}
        <span>${escapeHtml(label)}</span>
      </div>
      <div class="card-body">
        ${htmlContent}
      </div>
    </div>
  `;

  var container = document.getElementById('container');
  container.innerHTML = html;

  // Re-highlight code blocks
  container.querySelectorAll('pre code').forEach(block => {
    hljs.highlightElement(block);
  });

  // Add copy buttons
  addCopyButtons(container);

  // Re-render mermaid diagrams
  renderMermaid(container);
}

function showPlaceholder() {
  const html = `
    <div class="node-card">
      <div class="placeholder">
        <div class="placeholder-icon">🔍</div>
        <div class="placeholder-text">그래프에서 노드를 클릭하면 내용이 표시됩니다.</div>
      </div>
    </div>
  `;
  document.getElementById('container').innerHTML = html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}


// Show placeholder on load
document.addEventListener('DOMContentLoaded', showPlaceholder);

</script>

</body>
</html>
