<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/katex.min.css">
<script src="js/marked.min.js"></script>
<script src="js/highlight.min.js"></script>
<script src="js/katex.min.js"></script>
<script src="js/mermaid.min.js"></script>
<style>
/* ── Reset & Base ──────────────────────────────────────────── */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0f14;
  color: #e2e8f0;
  font-family: "Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;
  font-size: 13px;
  padding: 12px;
  overflow-x: hidden;
}

/* ── Scrollbar ─────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0d0f14; }
::-webkit-scrollbar-thumb { background: #2a3045; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #64748b; }

/* ── Node Detail Card ──────────────────────────────────────── */
.node-card {
  background: #111827;
  border: 1px solid #2a3045;
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 12px;
}

.card-header {
  font-size: 13px;
  font-weight: 700;
  color: #e2e8f0;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid #2a3045;
  display: flex;
  align-items: center;
  gap: 8px;
}

.type-badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.type-badge.notebook {
  background: #1e3a5f;
  color: #60a5fa;
}

.type-badge.concept {
  background: #7c2d12;
  color: #fb923c;
}

.card-body {
  line-height: 1.7;
}

/* ── Placeholder ───────────────────────────────────────────── */
.placeholder {
  text-align: center;
  padding: 40px 20px;
  color: #64748b;
}
.placeholder-icon { font-size: 28px; margin-bottom: 10px; }
.placeholder-text { font-size: 12px; }

/* ── Markdown content (chat.html과 동일) ──────────────────── */
.card-body p { margin: 0.4em 0; }
.card-body pre {
  position: relative;
  background: #0a0e17;
  border-left: 3px solid #f97316;
  border-radius: 0 4px 4px 0;
  padding: 8px;
  overflow-x: auto;
  font-size: 11px;
  line-height: 1.5;
  margin: 0.5em 0;
}
.copy-btn {
  position: absolute;
  top: 4px;
  right: 4px;
  background: #2a3045;
  color: #94a3b8;
  border: 1px solid #3a4055;
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px;
  font-family: "Pretendard","Malgun Gothic",sans-serif;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 1;
}
.card-body pre:hover .copy-btn { opacity: 1; }
.copy-btn:hover { background: #3a4055; color: #e2e8f0; }
.copy-btn.copied { color: #4ade80; border-color: #4ade80; }
.card-body pre code {
  background: none;
  color: inherit;
  padding: 0;
  border-radius: 0;
  font-size: 11px;
}
.card-body code {
  font-family: "JetBrains Mono",Consolas,monospace;
}
.card-body :not(pre) > code {
  background: #0d1117;
  color: #f97316;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
}
.card-body table { border-collapse: collapse; margin: 0.5em 0; width: 100%; }
.card-body th, .card-body td {
  border: 1px solid #2a3045;
  padding: 4px 8px;
  font-size: 12px;
  text-align: left;
}
.card-body th { background: #1e2330; color: #94a3b8; font-weight: 600; }
.card-body h1, .card-body h2, .card-body h3, .card-body h4, .card-body h5, .card-body h6 {
  color: #60a5fa;
  margin: 0.6em 0 0.3em;
}
.card-body h1 { font-size: 1.3em; }
.card-body h2 { font-size: 1.15em; }
.card-body h3 { font-size: 1.05em; }
.card-body ul, .card-body ol { padding-left: 1.5em; margin: 0.3em 0; }
.card-body li { margin: 0.15em 0; }
.card-body hr { border: none; border-top: 1px solid #2a3045; margin: 0.6em 0; }
.card-body blockquote {
  border-left: 3px solid #a78bfa;
  padding-left: 10px;
  color: #94a3b8;
  margin: 0.4em 0;
}
.card-body strong { color: #f1f5f9; }
.card-body em { color: #cbd5e1; }
.card-body a {
  color: #60a5fa;
  text-decoration: none;
}
.card-body a:hover { text-decoration: underline; }

/* ── Mermaid diagram ──────────────────────────────────────── */
.card-body .mermaid {
  display: flex;
  justify-content: center;
  margin: 0.8em 0;
}

.card-body .mermaid svg {
  max-width: 100%;
  height: auto;
}

</style>
</head>
<body>

<div id="container"></div>

<script>
// Mermaid code fence 인터셉트
const mermaidExtension = {
  renderer: {
    code(token) {
      if (token.lang === 'mermaid') {
        const escaped = (token.text || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        return '<div class="mermaid">' + escaped + '</div>';
      }
      return false;
    }
  }
};
marked.use(mermaidExtension);

// Configure marked
marked.setOptions({
  breaks: true,
  gfm: true,
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      try { return hljs.highlight(code, { language: lang }).value; }
      catch(e) {}
    }
    try { return hljs.highlightAuto(code).value; }
    catch(e) {}
    return code;
  }
});

// Configure mermaid
mermaid.initialize({
  startOnLoad: true,
  theme: 'dark',
  securityLevel: 'loose',
  darkMode: true,
  background: '#0d0f14',
  primaryColor: '#1e2330',
  primaryTextColor: '#e2e8f0',
  primaryBorderColor: '#2a3045',
  notebkgColor: '#111827',
  noteBorderColor: '#2a3045',
});

function showNodeDetail(label, nodeType, content) {
  const typeBadge = nodeType === 'notebook'
    ? '<span class="type-badge notebook">📓 Notebook</span>'
    : '<span class="type-badge concept">🔷 Concept</span>';

  const htmlContent = marked.parse(content);

  const html = `
    <div class="node-card">
      <div class="card-header">
        ${typeBadge}
        <span>${escapeHtml(label)}</span>
      </div>
      <div class="card-body">
        ${htmlContent}
      </div>
    </div>
  `;

  document.getElementById('container').innerHTML = html;

  // Re-highlight code blocks
  document.querySelectorAll('pre code').forEach(block => {
    hljs.highlightElement(block);
  });

  // Re-render mermaid diagrams
  try {
    const mermaidDivs = document.querySelectorAll('.mermaid');
    if (mermaidDivs.length > 0) {
      mermaid.run();
    }
  } catch (e) {
    console.error('Mermaid rendering error:', e);
  }
}

function showPlaceholder() {
  const html = `
    <div class="node-card">
      <div class="placeholder">
        <div class="placeholder-icon">🔍</div>
        <div class="placeholder-text">그래프에서 노드를 클릭하면 내용이 표시됩니다.</div>
      </div>
    </div>
  `;
  document.getElementById('container').innerHTML = html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function copyCode(btn) {
  const code = btn.previousElementSibling?.textContent || btn.parentElement.textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✓ 복사됨';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '복사';
      btn.classList.remove('copied');
    }, 2000);
  });
}

// Show placeholder on load
document.addEventListener('DOMContentLoaded', showPlaceholder);

</script>

</body>
</html>
