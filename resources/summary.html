<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/katex.min.css">
<script src="js/marked.min.js"></script>
<script src="js/highlight.min.js"></script>
<script src="js/katex.min.js"></script>
<script src="js/mermaid.min.js"></script>
<style>
/* ── Reset & Base ──────────────────────────────────────────── */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0f14;
  color: #e2e8f0;
  font-family: "Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;
  font-size: 13px;
  padding: 12px;
  overflow-x: hidden;
}

/* ── Scrollbar ─────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0d0f14; }
::-webkit-scrollbar-thumb { background: #2a3045; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #64748b; }

/* ── Summary Card ─────────────────────────────────────────── */
.summary-card {
  background: #111827;
  border: 1px solid #2a3045;
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 12px;
}
.card-header {
  font-size: 13px;
  font-weight: 700;
  color: #e2e8f0;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid #2a3045;
}
.card-body {
  line-height: 1.7;
}

/* ── Markdown content (chat.html과 동일) ──────────────────── */
.card-body p { margin: 0.4em 0; }
.card-body pre {
  position: relative;
  background: #0a0e17;
  border-left: 3px solid #f97316;
  border-radius: 0 4px 4px 0;
  padding: 8px;
  overflow-x: auto;
  font-size: 11px;
  line-height: 1.5;
  margin: 0.5em 0;
}
.copy-btn {
  position: absolute;
  top: 4px;
  right: 4px;
  background: #2a3045;
  color: #94a3b8;
  border: 1px solid #3a4055;
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px;
  font-family: "Pretendard","Malgun Gothic",sans-serif;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 1;
}
.card-body pre:hover .copy-btn { opacity: 1; }
.copy-btn:hover { background: #3a4055; color: #e2e8f0; }
.copy-btn.copied { color: #4ade80; border-color: #4ade80; }
.card-body pre code {
  background: none;
  color: inherit;
  padding: 0;
  border-radius: 0;
  font-size: 11px;
}
.card-body code {
  font-family: "JetBrains Mono",Consolas,monospace;
}
.card-body :not(pre) > code {
  background: #0d1117;
  color: #f97316;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
}
.card-body table { border-collapse: collapse; margin: 0.5em 0; width: 100%; }
.card-body th, .card-body td {
  border: 1px solid #2a3045;
  padding: 4px 8px;
  font-size: 12px;
  text-align: left;
}
.card-body th { background: #1e2330; color: #94a3b8; font-weight: 600; }
.card-body h1, .card-body h2, .card-body h3, .card-body h4, .card-body h5, .card-body h6 {
  color: #60a5fa;
  margin: 0.6em 0 0.3em;
}
.card-body h1 { font-size: 1.3em; }
.card-body h2 { font-size: 1.15em; }
.card-body h3 { font-size: 1.05em; }
.card-body ul, .card-body ol { padding-left: 1.5em; margin: 0.3em 0; }
.card-body li { margin: 0.15em 0; }
.card-body hr { border: none; border-top: 1px solid #2a3045; margin: 0.6em 0; }
.card-body blockquote {
  border-left: 3px solid #a78bfa;
  padding-left: 10px;
  color: #94a3b8;
  margin: 0.4em 0;
}
.card-body a { color: #60a5fa; text-decoration: none; }
.card-body a:hover { text-decoration: underline; }
.card-body strong { color: #f1f5f9; }
.card-body img { max-width: 100%; border-radius: 4px; }

/* ── Highlight.js dark theme (Atom One Dark inspired) ──────── */
.hljs { color: #abb2bf; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-section, .hljs-link { color: #c678dd; }
.hljs-function .hljs-keyword { color: #c678dd; }
.hljs-string, .hljs-addition { color: #98c379; }
.hljs-number, .hljs-attr { color: #d19a66; }
.hljs-comment, .hljs-quote, .hljs-deletion { color: #5c6370; font-style: italic; }
.hljs-title, .hljs-title.function_ { color: #61afef; }
.hljs-built_in, .hljs-type { color: #e5c07b; }
.hljs-variable, .hljs-template-variable { color: #e06c75; }
.hljs-name, .hljs-selector-id, .hljs-selector-class { color: #e06c75; }
.hljs-meta { color: #61afef; }
.hljs-params { color: #abb2bf; }
.hljs-subst { color: #e06c75; }
.hljs-regexp { color: #98c379; }
.hljs-symbol { color: #56b6c2; }
.hljs-doctag { color: #c678dd; }

/* ── KaTeX 다크 테마 ───────────────────────────────────────── */
.katex { color: #e2e8f0; font-size: 1.1em; }
.katex-display { margin: 0.6em 0; overflow-x: auto; }

/* ── Mermaid diagrams ─────────────────────────────────────── */
.mermaid-wrapper {
  background: #111827;
  border: 1px solid #2a3045;
  border-radius: 4px;
  padding: 12px;
  margin: 0.5em 0;
  overflow-x: auto;
  text-align: center;
}
.mermaid-wrapper svg { max-width: 100%; height: auto; }
.mermaid-error {
  color: #f87171;
  font-size: 11px;
  font-family: "JetBrains Mono", Consolas, monospace;
  padding: 4px;
}

/* ── Card action buttons (MD 복사) ────────────────────────── */
.card-actions {
  float: right;
  display: flex;
  gap: 4px;
  margin-left: 8px;
}
.action-btn {
  background: #2a3045;
  color: #94a3b8;
  border: 1px solid #3a4055;
  border-radius: 4px;
  padding: 2px 7px;
  font-size: 10px;
  font-family: "Pretendard","Malgun Gothic",sans-serif;
  cursor: pointer;
  line-height: 1.6;
}
.action-btn:hover { background: #3a4055; color: #e2e8f0; }
.action-btn.copied { color: #4ade80; border-color: #4ade80; }

/* ── Stale card (이전 프롬프트로 생성된 요약) ─────────────── */
.summary-card.stale {
  border-color: #92400e;
}
.summary-card.stale .card-header {
  background: linear-gradient(135deg, #451a03, #78350f);
  border-bottom-color: #92400e;
  border-radius: 6px 6px 0 0;
  padding: 6px 10px;
  margin: -12px -14px 8px -14px;
}
.stale-banner {
  background: #fef3c7;
  color: #92400e;
  border: 1px solid #f59e0b;
  border-radius: 6px;
  padding: 7px 12px;
  margin-bottom: 10px;
  font-size: 0.82em;
  line-height: 1.5;
}

/* ── Placeholder ──────────────────────────────────────────── */
.placeholder {
  color: #64748b;
  font-size: 12px;
  text-align: center;
  padding: 40px 20px;
}
</style>
</head>
<body>
<div id="cards-container"></div>

<script>
// ── Mermaid 초기화 ────────────────────────────────────────────
if (window.mermaid) {
  mermaid.initialize({
    startOnLoad: false,
    theme: 'dark',
    securityLevel: 'loose',
    fontFamily: '"Pretendard","Malgun Gothic",sans-serif',
    fontSize: 13,
    suppressErrorRendering: true
  });

  // 폭탄 아이콘이 들어간 error SVG를 DOM 어디에서든 자동 제거
  function _isMermaidErrorSvg(node) {
    if (!node || node.nodeType !== 1) return false;
    if (node.tagName !== 'svg' && node.tagName !== 'SVG') return false;
    var html = node.outerHTML || '';
    return html.indexOf('Syntax error') !== -1 ||
           html.indexOf('aria-roledescription="error"') !== -1;
  }
  var _mermaidObserver = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      m.addedNodes.forEach(function(node) {
        if (_isMermaidErrorSvg(node)) {
          var wrapper = node.closest && node.closest('.mermaid-wrapper');
          if (wrapper) wrapper.style.display = 'none';
          else node.remove();
        }
      });
    });
  });
  _mermaidObserver.observe(document.body, { childList: true, subtree: true });
}

// ── KaTeX 수학 확장 (marked.js 플러그인) ─────────────────────
function _katexRender(text, displayMode) {
  if (!window.katex) return null;
  try { return katex.renderToString(text, { displayMode: displayMode, throwOnError: false }); }
  catch(e) { return null; }
}

const mathExtension = {
  extensions: [
    {
      name: 'displayMath',
      level: 'block',
      start(src) { return src.indexOf('$$'); },
      tokenizer(src) {
        const m = src.match(/^\$\$([\s\S]*?)\$\$/);
        if (m) return { type: 'displayMath', raw: m[0], text: m[1].trim() };
      },
      renderer(token) {
        return _katexRender(token.text, true) || '<span>' + token.raw + '</span>';
      }
    },
    {
      name: 'displayMathBracket',
      level: 'block',
      start(src) { return src.indexOf('\\['); },
      tokenizer(src) {
        const m = src.match(/^\\\[([\s\S]*?)\\\]/);
        if (m) return { type: 'displayMathBracket', raw: m[0], text: m[1].trim() };
      },
      renderer(token) {
        return _katexRender(token.text, true) || '<span>' + token.raw + '</span>';
      }
    },
    {
      name: 'inlineMath',
      level: 'inline',
      start(src) { return src.indexOf('$'); },
      tokenizer(src) {
        const m = src.match(/^\$((?:[^$\\\n]|\\.)+?)\$/);
        if (m) return { type: 'inlineMath', raw: m[0], text: m[1].trim() };
      },
      renderer(token) {
        return _katexRender(token.text, false) || '<span>' + token.raw + '</span>';
      }
    },
    {
      name: 'inlineMathParen',
      level: 'inline',
      start(src) { return src.indexOf('\\('); },
      tokenizer(src) {
        const m = src.match(/^\\\(((?:[^\\]|\\.)*?)\\\)/);
        if (m) return { type: 'inlineMathParen', raw: m[0], text: m[1].trim() };
      },
      renderer(token) {
        return _katexRender(token.text, false) || '<span>' + token.raw + '</span>';
      }
    }
  ]
};
marked.use(mathExtension);

// ── Mermaid code fence 인터셉트 ───────────────────────────────
const mermaidExtension = {
  renderer: {
    code(token) {
      if (token.lang === 'mermaid') {
        const escaped = (token.text || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        return '<div class="mermaid-wrapper"><div class="mermaid">' + escaped + '</div></div>';
      }
      return false;
    }
  }
};
marked.use(mermaidExtension);

// ── Mermaid 다이어그램 렌더링 ─────────────────────────────────
function renderMermaid(root) {
  if (!window.mermaid) return;
  var nodes = root.querySelectorAll('.mermaid:not([data-processed])');
  if (!nodes.length) return;
  nodes.forEach(function(el) {
    var code = el.textContent;
    var id = 'mermaid-' + Math.random().toString(36).slice(2);
    el.setAttribute('data-processed', 'true');

    function hideWrapper() {
      var wrapper = el.closest('.mermaid-wrapper');
      if (wrapper) wrapper.style.display = 'none';
    }

    // 1) 먼저 mermaid.parse()로 문법 검증 (suppressErrors:true → 실패 시 false 반환)
    var parsePromise;
    try {
      parsePromise = mermaid.parse(code, { suppressErrors: true });
    } catch (e) {
      hideWrapper();
      return;
    }
    Promise.resolve(parsePromise).then(function(parseResult) {
      if (parseResult === false || parseResult === null || parseResult === undefined) {
        hideWrapper();
        return null;
      }
      // 2) 검증 통과 시에만 렌더 실행
      return mermaid.render(id, code);
    }).then(function(result) {
      if (!result || !result.svg) return;
      // 3) 결과 SVG에 에러 표식이 섞여 있으면 숨김 (방어 계층)
      if (result.svg.indexOf('Syntax error') !== -1 ||
          result.svg.indexOf('aria-roledescription="error"') !== -1) {
        hideWrapper();
        return;
      }
      el.innerHTML = result.svg;
    }).catch(function(err) {
      hideWrapper();
    });
  });
}

// ── marked.js 설정 ────────────────────────────────────────────
marked.setOptions({
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      try { return hljs.highlight(code, { language: lang }).value; }
      catch(e) {}
    }
    try { return hljs.highlightAuto(code).value; }
    catch(e) {}
    return code;
  },
  breaks: true,
  gfm: true
});

function fixMdSpaces(md) {
  return md.replace(/\*\*[ \t]+((?:[^\n*]|\*(?!\*))+?)[ \t]+\*\*/g, '**$1**');
}

var container = document.getElementById('cards-container');

// ── 코드 복사 버튼 ──────────────────────────────────────────────
function copyViaConsole(text) {
  console.log("__COPY__:" + text);
}

function addCopyButtons(root) {
  root.querySelectorAll('pre > code').forEach(function(codeEl) {
    var pre = codeEl.parentElement;
    if (pre.querySelector('.copy-btn')) return;
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '\uBCF5\uC0AC';
    btn.addEventListener('click', function() {
      copyViaConsole(codeEl.textContent);
      btn.textContent = '\u2713 \uBCF5\uC0AC\uB428';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.textContent = '\uBCF5\uC0AC';
        btn.classList.remove('copied');
      }, 1500);
    });
    pre.appendChild(btn);
  });
}

// ── Public API (Python에서 runJavaScript로 호출) ──────────────

function addSummaryCard(nbName, markdown, isStale) {
  // placeholder 제거
  var ph = container.querySelector('.placeholder');
  if (ph) ph.remove();

  var card = document.createElement('div');
  card.className = isStale ? 'summary-card stale' : 'summary-card';

  var header = document.createElement('div');
  header.className = 'card-header';

  // 액션 버튼
  var actions = document.createElement('div');
  actions.className = 'card-actions';

  var mdBtn = document.createElement('button');
  mdBtn.className = 'action-btn';
  mdBtn.textContent = 'MD';
  mdBtn.addEventListener('click', function() {
    copyViaConsole(markdown);
    mdBtn.textContent = '✓ 복사됨';
    mdBtn.classList.add('copied');
    setTimeout(function() { mdBtn.textContent = 'MD'; mdBtn.classList.remove('copied'); }, 1500);
  });

  var txtBtn = document.createElement('button');
  txtBtn.className = 'action-btn';
  txtBtn.textContent = 'Text';
  txtBtn.addEventListener('click', function() {
    var bodyEl = card.querySelector('.card-body');
    copyViaConsole(bodyEl ? bodyEl.innerText : '');
    txtBtn.textContent = '✓ 복사됨';
    txtBtn.classList.add('copied');
    setTimeout(function() { txtBtn.textContent = 'Text'; txtBtn.classList.remove('copied'); }, 1500);
  });

  actions.appendChild(mdBtn);
  actions.appendChild(txtBtn);
  header.appendChild(actions);

  var title = document.createElement('span');
  title.textContent = '\uD83D\uDCD3 ' + nbName;
  header.appendChild(title);

  card.appendChild(header);

  // stale 배너 (이전 프롬프트 경고)
  if (isStale) {
    var banner = document.createElement('div');
    banner.className = 'stale-banner';
    banner.innerHTML = '⚠️ <strong>이전 프롬프트로 생성된 요약</strong>입니다. 새 프롬프트로 다시 생성하려면 "요약 생성"을 클릭하세요.';
    card.appendChild(banner);
  }

  var body = document.createElement('div');
  body.className = 'card-body';
  body.innerHTML = marked.parse(fixMdSpaces(markdown));
  body.querySelectorAll('pre code:not(.hljs)').forEach(function(el) {
    hljs.highlightElement(el);
  });
  addCopyButtons(body);
  renderMermaid(body);
  card.appendChild(body);

  container.appendChild(card);
}

function clearCards() {
  container.innerHTML = '';
}

function showPlaceholder(msg) {
  container.innerHTML = '<div class="placeholder">' + msg + '</div>';
}

function setFontSize(px) {
  document.body.style.fontSize = px + 'px';
}
</script>
</body>
</html>
