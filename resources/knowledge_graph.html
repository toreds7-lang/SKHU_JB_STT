<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/d3.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d0f14;
      color: #e2e8f0;
      overflow: hidden;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    #graph-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    /* Node Styles */
    .node-notebook {
      fill: #4f8ef7;
      stroke: #1d4ed8;
      stroke-width: 1.5px;
    }

    .node-concept {
      fill: #f97316;
      stroke: #c2410c;
      stroke-width: 1.5px;
    }

    .node text {
      fill: #e2e8f0;
      font-size: 11px;
      pointer-events: none;
      text-shadow: 0 0 3px #0d0f14;
      text-anchor: middle;
    }

    .node circle:hover {
      filter: brightness(1.3);
      cursor: pointer;
    }

    .node.selected circle {
      stroke: #fde68a;
      stroke-width: 3px;
    }

    /* Link/Edge Styles */
    .link {
      stroke: #2a3045;
      stroke-opacity: 0.6;
      stroke-width: 1.5px;
      fill: none;
    }

    .link.highlighted {
      stroke: #4f8ef7;
      stroke-opacity: 1;
      stroke-width: 2px;
    }

    /* Tooltip */
    #tooltip {
      position: absolute;
      background: #1e2330;
      border: 1px solid #2a3045;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: #e2e8f0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      max-width: 220px;
      word-break: break-word;
      z-index: 1000;
    }

    /* Legend */
    #legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: #161922;
      border: 1px solid #2a3045;
      border-radius: 6px;
      padding: 12px;
      font-size: 11px;
      color: #94a3b8;
    }

    #legend-svg {
      display: block;
    }

    #legend-text {
      margin-top: 8px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="graph-container">
    <svg id="graph-svg"></svg>
  </div>

  <div id="tooltip"></div>

  <div id="legend">
    <svg id="legend-svg" width="140" height="50">
      <circle cx="12" cy="12" r="7" fill="#4f8ef7"/>
      <text x="24" y="16" fill="#94a3b8" font-size="11">노트북</text>

      <circle cx="12" cy="38" r="6" fill="#f97316"/>
      <text x="24" y="42" fill="#94a3b8" font-size="11">개념</text>
    </svg>
  </div>

  <script>
    // ── Global Error Handler ──────────────────────────────────────────────────
    window.addEventListener('error', (event) => {
      console.error(`Uncaught error: ${event.message} at ${event.filename}:${event.lineno}`);
    });

    // ── Global State ──────────────────────────────────────────────────────────
    let graphData = { nodes: [], edges: [] };
    let filteredData = { nodes: [], edges: [] };
    let simulation = null;
    let svg = null;
    let linkGroup = null;
    let nodeGroup = null;
    let selectedId = null;
    let isFiltered = false;

    // ── Entry point: Load graph data from Python ──────────────────────────────
    function loadGraphData(data) {
      graphData = data;
      filteredData = { nodes: [...data.nodes], edges: [...data.edges] };
      renderGraph();
    }

    // ── Filter graph to show only selected node and its neighbors ──────────────
    function filterNodeAndNeighbors(nodeId) {
      try {
        if (!isFiltered || selectedId !== nodeId) {
          // Enter filter mode
          const connectedIds = new Set([nodeId]);

          // Get source/target ID (handle both string IDs and object references)
          function getEdgeSourceId(edge) {
            if (!edge) return null;
            return typeof edge.source === 'string' ? edge.source : (edge.source && edge.source.id);
          }
          function getEdgeTargetId(edge) {
            if (!edge) return null;
            return typeof edge.target === 'string' ? edge.target : (edge.target && edge.target.id);
          }

          // Safe edge iteration
          if (graphData.edges && Array.isArray(graphData.edges)) {
            graphData.edges.forEach(edge => {
              try {
                const srcId = getEdgeSourceId(edge);
                const tgtId = getEdgeTargetId(edge);
                if (srcId === nodeId) connectedIds.add(tgtId);
                if (tgtId === nodeId) connectedIds.add(srcId);
              } catch (e) {
                console.warn("Error processing edge:", edge, e);
              }
            });
          }

          // Safe node/edge filtering
          filteredData.nodes = (graphData.nodes || []).filter(n => n && connectedIds.has(n.id));
          filteredData.edges = (graphData.edges || []).filter(e => {
            if (!e) return false;
            const srcId = getEdgeSourceId(e);
            const tgtId = getEdgeTargetId(e);
            return srcId && tgtId && connectedIds.has(srcId) && connectedIds.has(tgtId);
          });

          isFiltered = true;
          selectedId = nodeId;
        } else {
          // Exit filter mode
          filteredData = {
            nodes: graphData.nodes ? [...graphData.nodes] : [],
            edges: graphData.edges ? [...graphData.edges] : []
          };
          isFiltered = false;
          selectedId = null;
        }

        renderGraph();
      } catch (error) {
        console.error("filterNodeAndNeighbors error:", error);
      }
    }

    // ── Highlight a specific node ─────────────────────────────────────────────
    function highlightNode(id) {
      if (!nodeGroup) return;
      nodeGroup.selectAll(".node").classed("selected", d => d.id === id);
    }

    // ── Select node from external source (table) with camera zoom ──────────────
    function selectNodeExternal(nodeId) {
      try {
        if (!nodeGroup || !svg) {
          console.warn("selectNodeExternal: nodeGroup or svg not initialized");
          return;
        }

        // 1. Apply filter (same as clicking on node)
        filterNodeAndNeighbors(nodeId);

        // 2. Highlight the target node
        highlightNode(nodeId);

        // 3. Find node data and pan/zoom camera to center it
        const node = filteredData.nodes.find(n => n && n.id === nodeId);
        if (node && typeof node.x === 'number' && typeof node.y === 'number') {
          const container = document.getElementById("graph-container");
          if (!container) {
            console.warn("selectNodeExternal: graph-container not found");
            return;
          }

          const W = container.clientWidth;
          const H = container.clientHeight;

          if (W > 0 && H > 0) {
            svg.transition()
              .duration(600)
              .call(
                d3.zoom().transform,
                d3.zoomIdentity.translate(W / 2 - node.x, H / 2 - node.y)
              );
          }
        }
      } catch (error) {
        console.error("selectNodeExternal error:", error);
      }
    }

    // ── Main Render Function ──────────────────────────────────────────────────
    function renderGraph() {
      const container = document.getElementById("graph-container");
      const W = container.clientWidth;
      const H = container.clientHeight;

      // Stop previous simulation to avoid memory leak
      if (simulation) {
        simulation.stop();
      }

      // Clear previous
      d3.select("#graph-svg").selectAll("*").remove();

      svg = d3.select("#graph-svg");

      // Defs: Arrow marker for directed edges
      svg.append("defs").append("marker")
        .attr("id", "arrow")
        .attr("viewBox", "0 -5 10 10")
        .attr("refX", 20)
        .attr("refY", 0)
        .attr("markerWidth", 6)
        .attr("markerHeight", 6)
        .attr("orient", "auto")
        .append("path")
        .attr("d", "M0,-5L10,0L0,5")
        .attr("fill", "#4f8ef7");

      // Zoom/Pan container
      const zoomG = svg.append("g").attr("class", "zoom-group");

      svg.call(
        d3.zoom()
          .scaleExtent([0.2, 4])
          .on("zoom", e => zoomG.attr("transform", e.transform))
      );

      // Link and Node groups
      linkGroup = zoomG.append("g").attr("class", "links");
      nodeGroup = zoomG.append("g").attr("class", "nodes");

      // Guard: ensure we have valid data
      if (!filteredData.nodes || filteredData.nodes.length === 0) {
        console.warn("No nodes to render");
        return;
      }

      // Force simulation with filtered data
      simulation = d3.forceSimulation(filteredData.nodes)
        .force("link", d3.forceLink(filteredData.edges)
          .id(d => d.id)
          .distance(120)
        )
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(W / 2, H / 2))
        .force("collision", d3.forceCollide(30));

      // Render links
      const links = linkGroup.selectAll("line")
        .data(filteredData.edges)
        .join("line")
        .attr("class", "link")
        .attr("marker-end", "url(#arrow)");

      // Render nodes
      const nodes = nodeGroup.selectAll(".node")
        .data(filteredData.nodes)
        .join("g")
        .attr("class", "node")
        .call(
          d3.drag()
            .on("start", dragStart)
            .on("drag", dragging)
            .on("end", dragEnd)
        );

      // Node circles
      nodes.append("circle")
        .attr("r", d => d.type === "notebook" ? 14 : 10)
        .attr("class", d => `node-${d.type}`);

      // Node labels
      nodes.append("text")
        .attr("dy", d => d.type === "notebook" ? 26 : 22)
        .attr("text-anchor", "middle")
        .text(d => {
          const max_len = 15;
          return d.label.length > max_len ? d.label.slice(0, max_len - 1) + "…" : d.label;
        });

      // Node interactions
      nodes.on("click", (event, d) => {
        filterNodeAndNeighbors(d.id);
        highlightNode(d.id);

        // Signal Python via console.log protocol
        const payload = {
          id: d.id,
          label: d.label,
          type: d.type,
          summary: d.summary || "",
          content: d.content || ""
        };
        console.log("NODE_CLICK::" + JSON.stringify(payload));
      });

      // Tooltip on hover
      const tooltip = document.getElementById("tooltip");
      nodes.on("mouseover", (event, d) => {
        tooltip.style.opacity = "1";
        tooltip.innerHTML = `<b>${d.label}</b><br><span style="color:#94a3b8;font-size:11px">${d.summary || ""}</span>`;
      }).on("mousemove", event => {
        tooltip.style.left = (event.pageX + 12) + "px";
        tooltip.style.top = (event.pageY - 10) + "px";
      }).on("mouseout", () => {
        tooltip.style.opacity = "0";
      });

      // Simulation tick handler
      simulation.on("tick", () => {
        links
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        nodes.attr("transform", d => `translate(${d.x},${d.y})`);
      });
    }

    // ── Drag Handlers ─────────────────────────────────────────────────────────
    function dragStart(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }

    function dragging(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }

    function dragEnd(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }
  </script>
</body>
</html>
